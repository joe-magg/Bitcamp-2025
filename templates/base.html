<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} - Cipherzoic {% else %}Cipherzoic{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('encrypt') }}">
                <img src="{{ url_for('static', filename='images/g20.png') }}" alt="Cipherzoic Logo" height="50" class="d-inline-block align-text-bottom me-2">
                Cipherzoic</a>
            <div class="navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('encrypt') }}">Encrypt</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('decrypt') }}">Decrypt</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
            {# Content of specific pages will be inserted here #}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
</body>
</html>
