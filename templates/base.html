<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} - Caveman Cipher{% else %}Caveman Cipher{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px; /* Adjusted for fixed navbar height */
            background-image: url("{{ url_for('static', filename='WildernessCampfire.jpg') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-color: #f8f9fa;

            min-height: 100vh;
        }
        .navbar-brand {
            font-size: 1.5rem;
        }
        .nav-item {
            font-size: 1.1rem;
        }
        .container {
            margin-top: 20px;
        }
        .form-control {
            color: #999;
            background-color: transparent;
        }
        .form-control:focus {
            color: #999;
            background-color: transparent;
        }
        .form-control::placeholder {
            color: #999;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Caveman Cipher</a>
            <div class="navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('encrypt') }}">Encrypt</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('decrypt') }}">Decrypt</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
            {# Content of specific pages will be inserted here #}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
