{% extends "base.html" %}
{% block content %}
    <h2>Encrypt Text</h2>
    <p>Enter the text you want to encrypt:</p>
    <form method="post">
        <div class="form-group">
            <label for="plaintext">Plaintext:</label>
            <input type="text" class="form-control" id="plaintext" name="plaintext" required>
        </div>
        <button type="submit" class="btn btn-primary">Encrypt</button>
    </form>
    {% if ciphertext %}
        <div class="alert alert-success mt-3">
            <strong>Ciphertext:</strong> {{ ciphertext }}
        </div>
         <div class="mt-3">
            <a href="{{ url_for('decrypt', ciphertext=ciphertext, plaintext=plaintext) }}" class="btn btn-secondary">
                Go to Decrypt with this Ciphertext
            </a>
        </div>
    {% endif %}
{% endblock %}
